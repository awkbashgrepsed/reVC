name: reVC Windows x64 DirectX 9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: true
          ref: miami
      - name: Download Lua 5.4
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.lua.org/ftp/lua-5.4.8.tar.gz" -OutFile lua.tar.gz
          tar -xzf lua.tar.gz
          if (-not (Test-Path "lua-5.4.8/src")) {
            Write-Error "Lua source directory was not extracted as expected"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path src/extras | Out-Null
          Get-ChildItem "lua-5.4.8/src/*.c" | Where-Object { $_.Name -notin @("lua.c", "luac.c", "ltests.c") } | Copy-Item -Destination src/extras -Force
          Get-ChildItem "lua-5.4.8/src/*.h" | Copy-Item -Destination src/extras -Force
      - name: Configure
        shell: pwsh
        run: ./premake5 vs2022 --with-librw
      - name: Build DirectX 9
        run: msbuild -m build/reVC.sln /property:Configuration=Debug /property:Platform=win-amd64-librw_d3d9-oal
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "bin/win-amd64-librw_d3d9-oal/Debug/reVC.exe" package/
          Copy-Item "bin/win-amd64-librw_d3d9-oal/Debug/reVC.pdb" package/ -ErrorAction SilentlyContinue
          Copy-Item "vendor/mpg123/dist/Win64/libmpg123-0.dll" package/
          Copy-Item "vendor/openal-soft/dist/Win64/OpenAL32.dll" package/
          Compress-Archive -Path "package/*" -DestinationPath "reVC-modmenu-windows-d3d9-x64.zip" -Force
      - name: Commit ZIP to miami
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path builds | Out-Null
          Copy-Item "reVC-modmenu-windows-d3d9-x64.zip" "builds/reVC-modmenu-windows-d3d9-x64.zip" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "builds/reVC-modmenu-windows-d3d9-x64.zip"
          if (-not (git diff --cached --quiet)) {
            git commit -m "Build Windows DirectX 9 mod menu"
            git push origin HEAD:miami
          }
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: reVC-modmenu-windows-d3d9-x64
          path: reVC-modmenu-windows-d3d9-x64.zip
          if-no-files-found: error
          retention-days: 30
